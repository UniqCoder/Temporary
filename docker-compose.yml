services:
  db:
    image: postgres:16-alpine
    container_name: tempmemory_db
    environment:
      POSTGRES_USER: tempmemory
      POSTGRES_PASSWORD: tempmemory
      POSTGRES_DB: tempmemory
    ports:
      - "5433:5432"
    volumes:
      - tempmemory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempmemory -d tempmemory"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tempmemory_pgdata:
